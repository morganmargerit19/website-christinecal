name: Déploiement OVH (christinecal.com)

# Construit le nouveau site « Relier » (cible racine) et l'envoie en SFTP sur l'hébergement
# mutualisé OVH. Reste DORMANT tant que la variable de dépôt OVH_DEPLOY != 'true'
# (Settings → Secrets and variables → Actions → Variables).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'v3-src/**'
      - 'mon-espace/**'
      - '.github/workflows/deploy-ovh.yml'

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.OVH_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Écriture : les traductions automatiques sont enregistrées dans le dépôt.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v3-src/package-lock.json

      - name: Installer les dépendances
        working-directory: v3-src
        run: npm ci

      # Christine écrit en français (Mon espace) : ce qui a changé est traduit en
      # anglais, espagnol, italien et polonais avant la construction du site
      # (scripts/traduire.mjs, secret ANTHROPIC_API_KEY). Sans clé ou en cas d'échec,
      # le site part avec les traductions précédentes : la mise en ligne n'est jamais bloquée.
      - name: Traductions automatiques (EN, ES, IT, PL)
        working-directory: v3-src
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/traduire.mjs

      # Les traductions sont gardées dans le dépôt : la prochaine mise en ligne ne
      # retraduit que ce qui aura encore changé. Auteur distinct de Christine, donc
      # absent de son Historique dans Mon espace. Un push fait avec GITHUB_TOKEN ne
      # relance pas ce workflow.
      - name: Enregistrer les traductions
        continue-on-error: true
        run: |
          git config user.name "Traductions automatiques"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A v3-src/src/content/fiches v3-src/src/data
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -q -m "Traductions automatiques (EN, ES, IT, PL)"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Traductions non enregistrées dans le dépôt (elles sont quand même en ligne)."

      # Nouveau site « Relier » (en ligne depuis le 02/11/2026). Retour à l'ancien
      # design : remplacer cette étape par `npm run build` avec DEPLOY_TARGET=ovh
      # (astro.config.mjs, dossier src/), comme avant le 02/11.
      - name: Build (nouveau site, cible OVH, racine)
        working-directory: v3-src
        env:
          NOUVEAU_SITE_TARGET: ovh
        run: npx astro build --config astro.nouveau-site.config.mjs

      # « Mon espace » (gestion du site par Christine) : ajouté au site publié.
      # Sa configuration (mot de passe, clé GitHub) n'est PAS dans le dépôt :
      # elle reste sur le serveur, hors du dossier public (mon-espace/INSTALLATION.md).
      - name: Ajout de Mon espace
        run: |
          mkdir -p v3-src/dist/mon-espace/vendor
          cp mon-espace/index.html mon-espace/app.js mon-espace/app.css mon-espace/api.php mon-espace/.htaccess v3-src/dist/mon-espace/
          cp mon-espace/vendor/*.js mon-espace/vendor/.htaccess v3-src/dist/mon-espace/vendor/

      # OVH mutualisé refuse le FTPS explicite (« 500 This security scheme is not
      # implemented »). On déploie donc en SFTP (port 22, méthode OVH recommandée)
      # via lftp : `mirror -R` crée le dossier cible et `--delete` le garde propre.
      - name: Déploiement SFTP vers OVH
        env:
          SFTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          SFTP_USER: ${{ secrets.OVH_FTP_USER }}
          SFTP_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
          SFTP_DIR: ${{ vars.OVH_FTP_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          lftp -c "set sftp:auto-confirm yes; \
            open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST:22; \
            mirror -R --verbose --delete --parallel=4 ./v3-src/dist/ \"$SFTP_DIR\""

      # Configuration de Mon espace, écrite à partir de 2 secrets du dépôt
      # (MON_ESPACE_PASSWORD_HASH, MON_ESPACE_GITHUB_TOKEN) et déposée dans le
      # dossier parent du site (à côté de « www ») : jamais dans le site publié,
      # jamais dans le dépôt. Sans ces secrets, l'étape ne fait rien.
      - name: Configuration de Mon espace
        env:
          SFTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          SFTP_USER: ${{ secrets.OVH_FTP_USER }}
          SFTP_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
          SFTP_DIR: ${{ vars.OVH_FTP_DIR }}
          ME_HASH: ${{ secrets.MON_ESPACE_PASSWORD_HASH }}
          ME_TOKEN: ${{ secrets.MON_ESPACE_GITHUB_TOKEN }}
        run: |
          if [ -z "$ME_HASH" ] || [ -z "$ME_TOKEN" ]; then
            echo "Secrets Mon espace absents : configuration non déposée."
            exit 0
          fi
          printf '%s' "$ME_HASH" | grep -Eq '^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$' \
            || { echo "::error::MON_ESPACE_PASSWORD_HASH doit être l'empreinte qui commence par \$2y\$12\$"; exit 1; }
          printf '%s' "$ME_TOKEN" | grep -Eq '^github_pat_[A-Za-z0-9_]+$' \
            || { echo "::error::MON_ESPACE_GITHUB_TOKEN doit être la clé qui commence par github_pat_"; exit 1; }
          umask 077
          CONF="$RUNNER_TEMP/mon-espace-config.php"
          printf "<?php\nreturn [\n    'email' => 'cc.christinecal@gmail.com',\n    'password_hash' => '%s',\n    'github_token' => '%s',\n];\n" \
            "$ME_HASH" "$ME_TOKEN" > "$CONF"
          DEST="$(dirname "${SFTP_DIR%/}")"
          lftp -c "set sftp:auto-confirm yes; \
            open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST:22; \
            put \"$CONF\" -o \"$DEST/mon-espace-config.php\"; \
            chmod 600 \"$DEST/mon-espace-config.php\""
          rm -f "$CONF"

      # Redirections SEO des 2 anciens domaines (coach-medium / coach-quantique) :
      # on dépose leur .htaccess dans des dossiers dédiés sur OVH. Il restera à
      # repointer ces 2 domaines dessus dans Multisite (l'ancien WP est conservé).
      - name: Déploiement SFTP des redirections (anciens domaines)
        env:
          SFTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          SFTP_USER: ${{ secrets.OVH_FTP_USER }}
          SFTP_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          mkdir -p _redir/coach-redir _redir/coach-quantique-redir
          cp redirects/coach-medium.com.htaccess    _redir/coach-redir/.htaccess
          cp redirects/coach-quantique.com.htaccess _redir/coach-quantique-redir/.htaccess
          lftp -c "set sftp:auto-confirm yes; \
            open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST:22; \
            mirror -R --verbose _redir/coach-redir coach-redir; \
            mirror -R --verbose _redir/coach-quantique-redir coach-quantique-redir"
